version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "meteor_mod"
path = "src/lib.rs"

[dependencies]
meteor-core = { path = "../../core" }
horizon-api-shim = { path = "../shim" }
